name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # to publish the APK as a GitHub Release
  pages: write      # to publish the iPhone/web app on GitHub Pages
  id-token: write

jobs:
  test-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: History unit tests
        run: TZ=Africa/Cairo python tests/test_history.py
      - name: End-to-end test (agent + monitor against a mock ntfy)
        run: python tests/test_e2e.py

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    env:
      DW_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.DW_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.DW_KEYSTORE_PASSWORD }}
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/dw.jks"
          echo "DW_KEYSTORE=$RUNNER_TEMP/dw.jks" >> "$GITHUB_ENV"
          echo "DW_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Build APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename
        run: cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/DeviceWatch.apk" && ls -la "$RUNNER_TEMP/DeviceWatch.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: DeviceWatch-apk
          path: ${{ runner.temp }}/DeviceWatch.apk

      - name: Publish to Releases (download it straight from your phone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create apk-latest "$RUNNER_TEMP/DeviceWatch.apk" \
            --title "DeviceWatch build ${{ github.run_number }}" \
            --notes "Android app. Open this page on your phone and tap DeviceWatch.apk to install." \
            --latest

  web:
    # The iPhone / web app (phone-app/) -> https://<you>.github.io/device-watch/
    # One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: phone-app
      - id: deploy
        uses: actions/deploy-pages@v4
